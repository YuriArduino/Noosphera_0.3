[alembic]
# Script location relative to this .ini file
script_location = %(here)s

# Path resolution for imports (redundante com env.py, mas útil)
prepend_sys_path = ../src

# Placeholder — será sobrescrito por env.py via NISABA_DATABASE_URL
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Opcional: hooks para formatar migrations automaticamente
# hooks = black
# black.type = exec
# black.executable = %(here)s/.venv/bin/black
# black.options = REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
