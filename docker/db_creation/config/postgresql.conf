#------------------------------------------------------------------------------
# NOOSPHERA POSTGRESQL 18 CONFIGURATION
# Otimizado para IA, pgvector e JSONB
#------------------------------------------------------------------------------

#------------------------------------------------------------------------------
# MEMORY CONFIGURATION
#------------------------------------------------------------------------------
shared_buffers = '512MB'
work_mem = '64MB'
maintenance_work_mem = '256MB'
effective_cache_size = '2GB'
hash_mem_multiplier = 2.0

#------------------------------------------------------------------------------
# QUERY PLANNING (SSD Optimized)
#------------------------------------------------------------------------------
random_page_cost = 1.1
seq_page_cost = 1.0
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0005
parallel_setup_cost = 1000.0
parallel_tuple_cost = 0.1

# Parallel Query
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4
parallel_leader_participation = on

#------------------------------------------------------------------------------
# CONNECTIONS
#------------------------------------------------------------------------------
max_connections = 100
superuser_reserved_connections = 3
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6

#------------------------------------------------------------------------------
# WRITE-AHEAD LOG (WAL)
#------------------------------------------------------------------------------
wal_level = 'replica'
wal_buffers = '16MB'
min_wal_size = '1GB'
max_wal_size = '4GB'
wal_keep_size = '0'
wal_compression = on
wal_log_hints = on
wal_receiver_timeout = '60s'
wal_sender_timeout = '60s'
wal_retrieve_retry_interval = '5s'

#------------------------------------------------------------------------------
# CHECKPOINT
#------------------------------------------------------------------------------
checkpoint_completion_target = 0.9
checkpoint_timeout = '15min'
checkpoint_warning = '30s'

#------------------------------------------------------------------------------
# BACKGROUND WRITER
#------------------------------------------------------------------------------
bgwriter_delay = '200ms'
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0
bgwriter_flush_after = '512kB'

#------------------------------------------------------------------------------
# QUERY TUNING
#------------------------------------------------------------------------------
enable_partitionwise_join = on
enable_partitionwise_aggregate = on
enable_parallel_hash = on
enable_indexonlyscan = on
enable_indexscan = on
enable_bitmapscan = on
enable_tidscan = on
enable_sort = on
enable_hashagg = on
enable_material = on

# JIT Compilation (PostgreSQL 18)
jit = on
jit_above_cost = 100000
jit_inline_above_cost = 500000
jit_optimize_above_cost = 500000

#------------------------------------------------------------------------------
# EXTENSIONS
#------------------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements,vector'

#------------------------------------------------------------------------------
# AUTOVACUUM (Critical for pgvector/JSONB performance)
#------------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 5
autovacuum_naptime = '1min'
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_insert_threshold = 1000
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.025
autovacuum_vacuum_cost_limit = 2000
autovacuum_vacuum_cost_delay = '5ms'
autovacuum_freeze_max_age = 200000000
vacuum_freeze_min_age = 50000000
vacuum_freeze_table_age = 150000000

#------------------------------------------------------------------------------
# LOGGING
#------------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0600
log_truncate_on_rotation = on
log_rotation_age = '1d'
log_rotation_size = '100MB'

log_checkpoints = on
log_connections = on
log_disconnections = on
log_duration = off
log_error_verbosity = 'default'
log_hostname = on
log_line_prefix = '%m [%p] %q%u@%d '
log_lock_waits = on
log_statement = 'ddl'
log_temp_files = '10MB'
log_timezone = 'America/Sao_Paulo'
log_autovacuum_min_duration = '1min'

#------------------------------------------------------------------------------
# STATISTICS
#------------------------------------------------------------------------------
track_activities = on
track_activity_query_size = 4096
track_counts = on
track_io_timing = on
track_functions = 'pl'
track_wal_io_timing = on
compute_query_id = 'auto'

#------------------------------------------------------------------------------
# CLIENT CONNECTION
#------------------------------------------------------------------------------
listen_addresses = '*'
max_prepared_transactions = 100
bytea_output = 'escape'
xmlbinary = 'base64'
xmloption = 'content'

# Client Encoding
client_encoding = 'UTF8'
lc_messages = 'C.UTF-8'
lc_monetary = 'C.UTF-8'
lc_numeric = 'C.UTF-8'
lc_time = 'C.UTF-8'
default_text_search_config = 'pg_catalog.english'

#------------------------------------------------------------------------------
# TIMEZONE
#------------------------------------------------------------------------------
timezone = 'America/Sao_Paulo'
timezone_abbreviations = 'Default'

#------------------------------------------------------------------------------
# SSL (Desabilitado para desenvolvimento local)
#------------------------------------------------------------------------------
ssl = off
ssl_ca_file = ''
ssl_cert_file = ''
ssl_key_file = ''
ssl_crl_file = ''
ssl_crl_dir = ''
ssl_min_protocol_version = 'TLSv1.2'
ssl_max_protocol_version = ''
ssl_dh_params_file = ''
ssl_passphrase_command = ''
ssl_passphrase_command_supports_reload = off

#------------------------------------------------------------------------------
# LOCK MANAGEMENT
#------------------------------------------------------------------------------
deadlock_timeout = '1s'
max_locks_per_transaction = 128
max_pred_locks_per_transaction = 128
max_pred_locks_per_relation = -2
max_pred_locks_per_page = 2

#------------------------------------------------------------------------------
# RESOURCE USAGE
#------------------------------------------------------------------------------
max_files_per_process = 1000
max_worker_processes = 16
max_logical_replication_workers = 4
max_sync_workers_per_subscription = 2
backend_flush_after = '256kB'
effective_io_concurrency = 200
