#------------------------------------------------------------------------------
# NOOSPHERA POSTGRESQL 18 CONFIGURATION
# Optimized for AI Workloads, pgvector (HNSW), pg_search (BM25), and JSONB
# Hardware Target: 4 Cores, SSD Storage
#------------------------------------------------------------------------------

#------------------------------------------------------------------------------
# MEMORY CONFIGURATION
#------------------------------------------------------------------------------
shared_buffers = '1GB'                  # Critical for caching vector indexes
work_mem = '16MB'                       # Per-operation memory (sorts, hashes)
maintenance_work_mem = '512MB'          # Boosted for HNSW/BM25 index creation
effective_cache_size = '4GB'            # Estimate of OS cache available
hash_mem_multiplier = 2.0
huge_pages = try                        # Linux Huge Pages optimization

#------------------------------------------------------------------------------
# PARALLELISM & RESOURCE USAGE (Optimized for 4 Physical Cores)
#------------------------------------------------------------------------------
max_worker_processes = 8                # Total background workers
max_parallel_workers = 4                # Max workers for parallel queries
max_parallel_workers_per_gather = 2     # Max workers per single query node
max_parallel_maintenance_workers = 2    # Parallel index builds (pgvector)
parallel_leader_participation = on

max_files_per_process = 1000
backend_flush_after = '256kB'
effective_io_concurrency = 200          # SSD optimized

#------------------------------------------------------------------------------
# QUERY PLANNING (SSD Optimized)
#------------------------------------------------------------------------------
random_page_cost = 1.1                  # SSDs have fast random access
seq_page_cost = 1.0
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0005
parallel_setup_cost = 1000.0
parallel_tuple_cost = 0.1

#------------------------------------------------------------------------------
# CONNECTIONS
#------------------------------------------------------------------------------
listen_addresses = '*'
max_connections = 40
superuser_reserved_connections = 3
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6
max_prepared_transactions = 0
idle_in_transaction_session_timeout = '5min' # Prevent abandoned agent transactions
statement_timeout = '30min'                  # Prevent runaway semantic/vector queries
#------------------------------------------------------------------------------
# WRITE-AHEAD LOG (WAL) & CHECKPOINTS
#------------------------------------------------------------------------------
wal_level = 'replica'
wal_buffers = '16MB'
min_wal_size = '1GB'
max_wal_size = '4GB'
wal_keep_size = '0'
wal_compression = on
wal_log_hints = on
wal_receiver_timeout = '60s'
wal_sender_timeout = '60s'
wal_retrieve_retry_interval = '5s'

checkpoint_timeout = '15min'
checkpoint_completion_target = 0.9      # Spreads checkpoint I/O, excellent for SSDs
checkpoint_warning = '30s'

#------------------------------------------------------------------------------
# BACKGROUND WRITER
#------------------------------------------------------------------------------
bgwriter_delay = '200ms'
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0
bgwriter_flush_after = '512kB'

#------------------------------------------------------------------------------
# QUERY TUNING & JIT
#------------------------------------------------------------------------------
enable_partitionwise_join = on
enable_partitionwise_aggregate = on
enable_parallel_hash = on
enable_indexonlyscan = on
enable_indexscan = on
enable_bitmapscan = on
enable_tidscan = on
enable_sort = on
enable_hashagg = on
enable_material = on

# JIT Compilation (Adjusted to avoid overhead on fast vector queries)
jit = on
jit_above_cost = 150000                 # Increased threshold
jit_inline_above_cost = 500000
jit_optimize_above_cost = 500000

#------------------------------------------------------------------------------
# EXTENSIONS
#------------------------------------------------------------------------------
# Preload libraries required for BM25 hooks and query monitoring
shared_preload_libraries = 'pg_stat_statements,pg_search'

#------------------------------------------------------------------------------
# AUTOVACUUM (Aggressive tuning for JSONB and Vector bloat prevention)
#------------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 5
autovacuum_naptime = '1min'
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_insert_threshold = 1000
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.025
autovacuum_vacuum_cost_limit = 2000
autovacuum_vacuum_cost_delay = '5ms'
autovacuum_freeze_max_age = 200000000
vacuum_freeze_min_age = 50000000
vacuum_freeze_table_age = 150000000

#------------------------------------------------------------------------------
# LOGGING
#------------------------------------------------------------------------------
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_file_mode = 0600
log_truncate_on_rotation = on
log_rotation_age = '1d'
log_rotation_size = '100MB'

log_checkpoints = on
log_connections = on
log_disconnections = on
log_duration = off
log_error_verbosity = 'default'
log_hostname = on
log_line_prefix = '%m [%p] %q%u@%d '
log_lock_waits = on
log_statement = 'ddl'
log_temp_files = '10MB'
log_timezone = 'America/Sao_Paulo'
log_autovacuum_min_duration = '1min'

#------------------------------------------------------------------------------
# STATISTICS
#------------------------------------------------------------------------------
track_activities = on
track_activity_query_size = 4096
track_counts = on
track_io_timing = on
track_functions = 'pl'
track_wal_io_timing = on
compute_query_id = 'auto'

#------------------------------------------------------------------------------
# CLIENT ENCODING & LOCALE
#------------------------------------------------------------------------------
client_encoding = 'UTF8'
lc_messages = 'C.UTF-8'
lc_monetary = 'C.UTF-8'
lc_numeric = 'C.UTF-8'
lc_time = 'C.UTF-8'
default_text_search_config = 'pg_catalog.simple'

bytea_output = 'escape'
xmlbinary = 'base64'
xmloption = 'content'

#------------------------------------------------------------------------------
# TIMEZONE
#------------------------------------------------------------------------------
timezone = 'UTC'
log_timezone = 'America/Sao_Paulo'
timezone_abbreviations = 'Default'

#------------------------------------------------------------------------------
# SSL (Disabled for local/container development)
#------------------------------------------------------------------------------
ssl = off
ssl_min_protocol_version = 'TLSv1.2'

#------------------------------------------------------------------------------
# LOCK MANAGEMENT
#------------------------------------------------------------------------------
deadlock_timeout = '1s'
max_locks_per_transaction = 128
max_pred_locks_per_transaction = 128
max_pred_locks_per_relation = -2
max_pred_locks_per_page = 2
