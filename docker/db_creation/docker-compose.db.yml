# =============================================================================
# NOÖSPHERA — Cognitive Infrastructure Stack
# -----------------------------------------------------------------------------
# Purpose:
#   Hybrid AI infrastructure composed of:
#   - PostgreSQL 18 + pgvector + semantic search
#   - Neo4j semantic graph engine
#   - Prefect orchestration layer
#   - pgAdmin auditing interface
#
# Architecture Goals:
#   - Modular cognitive infrastructure
#   - Semantic memory persistence
#   - Distributed agent orchestration
#   - Local-first AI operations
#   - Hybrid symbolic/vector retrieval
#
# Recommended:
#   Docker Compose v2+
#
# Author:
#   Project Noösphera
# =============================================================================

# =============================================================================
# SERVICES
# =============================================================================

services:

  # ===========================================================================
  # CORE DATABASE LAYER
  # PostgreSQL 18 + pgvector + semantic extensions
  # ===========================================================================
  db:

    build:
      context: .
      dockerfile: Dockerfile

    image: noosphera-postgres:18-ai

    container_name: ${CONTAINER_NAME:-noosphera_db}

    restart: unless-stopped

    shm_size: ${SHM_SIZE:-1gb}

    env_file:
      - .env

    environment:

      # -----------------------------------------------------------------------
      # PostgreSQL Core
      # -----------------------------------------------------------------------
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      # Optional bootstrap database
      POSTGRES_DB: ${POSTGRES_DB:-postgres}

      # -----------------------------------------------------------------------
      # LM Studio Integration
      # Internal OpenAI-compatible endpoint
      # -----------------------------------------------------------------------
      OPENAI_API_KEY: ${OPENAI_API_KEY:-lm-studio}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-http://host.docker.internal:1234/v1}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:

      # -----------------------------------------------------------------------
      # Persistent PostgreSQL Storage
      # -----------------------------------------------------------------------
      - ${DATA_DIR}:/var/lib/postgresql

      # -----------------------------------------------------------------------
      # Initialization Scripts (Idempotent)
      # Executed only during first database initialization
      # -----------------------------------------------------------------------
      - ./init/01-setup-template.sql:/docker-entrypoint-initdb.d/01-setup-template.sql:ro
      - ./init/02-create-databases.sql:/docker-entrypoint-initdb.d/02-create-databases.sql:ro
      - ./init/03-setup-agents.sh:/docker-entrypoint-initdb.d/03-setup-agents.sh:ro

      # -----------------------------------------------------------------------
      # Custom PostgreSQL Configuration
      # -----------------------------------------------------------------------
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro

    # -------------------------------------------------------------------------
    # Explicitly load custom PostgreSQL configuration
    # -------------------------------------------------------------------------
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf

    # -------------------------------------------------------------------------
    # Healthcheck
    # -------------------------------------------------------------------------
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-postgres}"
        ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s

    networks:
      - noosphera_network

    # -------------------------------------------------------------------------
    # Linux Host Bridge Support
    # Required for LM Studio integration on Linux hosts
    # -------------------------------------------------------------------------
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # -------------------------------------------------------------------------
    # Resource Constraints
    # -------------------------------------------------------------------------
    deploy:
      resources:
        limits:
          memory: 4g

  # ===========================================================================
  # SEMANTIC GRAPH ENGINE
  # Neo4j 5+
  # ===========================================================================
  neo4j:

    image: neo4j:latest

    container_name: noosphera_graph

    restart: unless-stopped

    ports:
      - "7474:7474"   # Neo4j Browser UI
      - "7687:7687"   # Bolt Driver

    environment:

      # -----------------------------------------------------------------------
      # Authentication
      # -----------------------------------------------------------------------
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/3759_noosphera}

      # -----------------------------------------------------------------------
      # APOC Plugin
      # -----------------------------------------------------------------------
      NEO4J_PLUGINS: '["apoc"]'

      # -----------------------------------------------------------------------
      # Memory Optimization
      # Tuned for mid-range systems
      # -----------------------------------------------------------------------
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M

    volumes:

      # -----------------------------------------------------------------------
      # Persistent Graph Storage
      # -----------------------------------------------------------------------
      - ${NEO4J_DATA_DIR}:/data

    healthcheck:
      test:
        [
          "CMD",
          "cypher-shell",
          "-u",
          "${NEO4J_USER:-neo4j}",
          "-p",
          "${NEO4J_PASSWORD:-3759_noosphera}",
          "RETURN 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - noosphera_network

    deploy:
      resources:
        limits:
          memory: 2g

  # ===========================================================================
  # AI ORCHESTRATION LAYER
  # Prefect 3
  # ===========================================================================

  prefect:

    image: prefecthq/prefect:3-python3.12

    container_name: noosphera_prefect

    restart: unless-stopped

    command: >
      prefect server start
      --host 0.0.0.0
      --port 4200

    ports:
      - "4200:4200"

    env_file:
      - .env

    environment:

      # -----------------------------------------------------------------------
      # Prefect API Configuration
      # -----------------------------------------------------------------------
      PREFECT_SERVER_API_HOST: 0.0.0.0

      # Internal container communication
      PREFECT_API_URL: http://localhost:4200/api

      # -----------------------------------------------------------------------
      # PostgreSQL Backend
      # -----------------------------------------------------------------------
      PREFECT_API_DATABASE_CONNECTION_URL: ${PREFECT_DB_URL}

    depends_on:
      db:
        condition: service_healthy

    volumes:

      # -----------------------------------------------------------------------
      # Prefect Persistent Storage
      # -----------------------------------------------------------------------
      - prefect_data:/root/.prefect

    networks:
      - noosphera_network

    deploy:
      resources:
        limits:
          memory: 1g

  # ===========================================================================
  # DATABASE ADMINISTRATION INTERFACE
  # pgAdmin 4
  # ===========================================================================
  pgadmin:

    image: dpage/pgadmin4:latest

    container_name: ${PGADMIN_CONTAINER_NAME:-noosphera_pgadmin}

    restart: unless-stopped

    env_file:
      - .env

    environment:

      # -----------------------------------------------------------------------
      # Authentication
      # -----------------------------------------------------------------------
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

      # Disable multi-user mode
      PGADMIN_CONFIG_SERVER_MODE: "False"

    ports:
      - "${PGADMIN_PORT:-8080}:80"

    volumes:

      # -----------------------------------------------------------------------
      # Persistent pgAdmin Storage
      # -----------------------------------------------------------------------
      - pgadmin_data:/var/lib/pgadmin

      # -----------------------------------------------------------------------
      # Preloaded Server Definitions
      # -----------------------------------------------------------------------
      - ./servers.json:/pgadmin4/servers.json:ro

      # -----------------------------------------------------------------------
      # Automatic Server Reload Script
      # -----------------------------------------------------------------------
      - ./reload-servers.sh:/reload-servers.sh:ro

      # -----------------------------------------------------------------------
      # Backup Storage
      # -----------------------------------------------------------------------
      - ./backups:/storage

    # -------------------------------------------------------------------------
    # Load custom server registry before startup
    # -------------------------------------------------------------------------
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "/reload-servers.sh && /entrypoint.sh"
      ]

    depends_on:
      db:
        condition: service_healthy

    networks:
      - noosphera_network

    extra_hosts:
      - "host.docker.internal:host-gateway"

    deploy:
      resources:
        limits:
          memory: 1g

# =============================================================================
# NETWORKS
# =============================================================================

networks:

  noosphera_network:

    name: ${NETWORK_NAME:-noosphera_db_network}

    driver: bridge

# =============================================================================
# VOLUMES
# =============================================================================

volumes:

  # ---------------------------------------------------------------------------
  # pgAdmin persistent storage
  # ---------------------------------------------------------------------------
  pgadmin_data:

    name: noosphera_pgadmin_data

  # ---------------------------------------------------------------------------
  # Prefect persistent storage
  # ---------------------------------------------------------------------------
  prefect_data:

    name: noosphera_prefect_data
